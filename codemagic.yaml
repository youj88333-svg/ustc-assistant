workflows:
  ios-i1-foundation:
    name: iOS I1 - private storage and bootstrap
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      flutter: '3.47.7'
      xcode: '27.1'
    scripts:
      - name: Validate native storage, simulator lifecycle and device AOT
        script: bash tools/ios-i1/build.sh
    artifacts:
      - app/build/ios-i1/artifacts/ios-i1-unsigned.ipa
      - app/build/ios-i1/artifacts/ios-i1-verification.json
      - app/build/ios-i1/artifacts/ios-i1-provenance.json
      - app/build/ios-i1/artifacts/i1-build.log
      - app/build/ios-i1/artifacts/i1-xcode.txt
      - app/build/ios-i1/artifacts/i1-simulator-test.log
      - app/build/ios-i1/artifacts/ios-i1-pubspec.lock
      - app/build/ios-i1/artifacts/i1-simulator-selection.txt

  ios-i0-preflight:
    name: iOS I0 - source and Mac preflight
    instance_type: mac_mini_m2
    max_build_duration: 5
    environment:
      xcode: '27.1'
    scripts:
      - name: Verify the public checkout and native toolchain
        script: bash tools/ios-i0/preflight.sh
    artifacts:
      - app/build/ios-i0/artifacts/i0-preflight.json

  ios-i0-probe:
    name: iOS I0 - unsigned device and Widget probe
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: '3.47.7'
      xcode: '27.1'
    scripts:
      - name: Verify source and native toolchain
        script: bash tools/ios-i0/preflight.sh
      - name: Build and verify the isolated Release probe
        script: bash tools/ios-i0/build.sh
    artifacts:
      - app/build/ios-i0/artifacts/i0-preflight.json
      - app/build/ios-i0/artifacts/ios-i0-unsigned.ipa
      - app/build/ios-i0/artifacts/ios-i0-verification.json
      - app/build/ios-i0/artifacts/ios-i0-signing-input.ipa
      - app/build/ios-i0/artifacts/ios-i0-signing-input-verification.json
      - app/build/ios-i0/artifacts/ios-i0-entitlement-request.json
      - app/build/ios-i0/artifacts/ios-i0-provenance.json
      - app/build/ios-i0/artifacts/Runner.entitlements
      - app/build/ios-i0/artifacts/I0Widget.entitlements
      - app/build/ios-i0/artifacts/i0-build.log
