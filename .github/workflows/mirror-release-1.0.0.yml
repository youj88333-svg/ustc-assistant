name: Mirror verified 1.0.0 release assets

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: mirror-release-1.0.0
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'youj88333-svg/ustc-assistant' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Download and verify frozen public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release-1.0.0"
          cd "$RUNNER_TEMP/release-1.0.0"
          cat > expected.sha256 <<'CHECKSUMS'
          084288fe5e11e16397da109e3b96ab57c57afd80b95c43ab2c5b7e75a63006df  release-manifest.json
          d28798679e185108dd8279a04b6cebf196ba3423c3c0aab9caa18160d364bbd5  release-notes.md
          c76dd18b66784959411e086fbf146809eefb129a4f50e792c3491931bfff7496  SHA256SUMS.txt
          32f06c244487b5e98fe356d175aa32bf40edffcd3e01adfec501e5e9c6b4c405  USTC-Assistant-1.0.0-windows-x64.zip
          9914212fc906b12429a1272b5b8f2230d9a7d66cd5066281dfe09752839a3218  app-arm64-v8a-release.apk
          2d3f4bac250f04818908181799f749a74ac06d6e7845adf3163f80bdc0f6eda3  app-x86_64-release.apk
          CHECKSUMS
          base='https://git.ustc.edu.cn/api/v4/projects/6522/packages/generic/release-assets/v1.0.0'
          while read -r digest file; do
            curl --disable --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 20 --max-time 180 \
              "$base/$file" --output "$file"
            printf '%s  %s\n' "$digest" "$file" | sha256sum --check --strict -
          done < expected.sha256

      - name: Upload missing matching assets to the existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='youj88333-svg/ustc-assistant'
          test "$GITHUB_REPOSITORY" = "$repo"
          test "$(gh api "repos/$repo/git/ref/tags/v1.0.0" --jq '.object.sha')" = '9515e50a95d6988f0d1a438566b5957e0e88d78a'
          gh api "repos/$repo/releases/425339613" \
            --jq '.tag_name == "v1.0.0" and .draft == true' | grep -x true
          cd "$RUNNER_TEMP/release-1.0.0"
          while read -r digest file; do
            assets="$(gh api "repos/$repo/releases/425339613/assets")"
            count="$(jq --arg file "$file" '[.[] | select(.name == $file)] | length' <<< "$assets")"
            if [ "$count" = 0 ]; then
              gh release upload v1.0.0 "$file" --repo "$repo"
              assets="$(gh api "repos/$repo/releases/425339613/assets")"
            elif [ "$count" != 1 ]; then
              echo 'Unexpected duplicate asset name' >&2
              exit 1
            fi
            bytes="$(stat -c '%s' "$file")"
            jq --exit-status --arg file "$file" --arg digest "sha256:$digest" --argjson bytes "$bytes" \
              '[.[] | select(.name == $file)] | length == 1 and all(.[]; .state == "uploaded" and .size == $bytes and .digest == $digest)' \
              <<< "$assets" > /dev/null
            printf 'Verified remote asset: %s\n' "$file"
          done < expected.sha256
